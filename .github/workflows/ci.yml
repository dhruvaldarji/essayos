name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    name: Package self-test (lint + fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run EssayOS self-test (structural lint + fixture assertions)
        run: npm test

  plugin-validate:
    name: Claude plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict

  plugin-evals:
    # Behavioral spec. Every run is a real model call on the repo's key, so the job runs only when
    # the secret is present (forks and unconfigured checkouts skip it) and stays under a cost cap.
    name: Plugin evals (claude plugin eval)
    runs-on: ubuntu-latest
    needs: [selftest, plugin-validate]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for credentials
        id: creds
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "ANTHROPIC_API_KEY not set; skipping evals"; fi
      - name: Install Claude Code
        if: steps.creds.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the eval suite
        if: steps.creds.outputs.present == 'true'
        run: |
          claude plugin eval . \
            --trust-plugin \
            --json results.json \
            --threshold 0.8 \
            --ablation none \
            --model claude-sonnet-5 \
            --judge-model claude-haiku-4-5 \
            --allow-tools Write Edit \
            --no-publish \
            --max-cost-usd 15
      - name: Upload eval results
        if: always() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: |
            results.json
            evals/results/
